name: deploy
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-update]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write        # the faces this renders are committed back

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # A newly seated trader has no face until the generator runs, and until
      # today that was a human's job to remember. It was forgotten twice in two
      # days, both times for a real principal: vector on 07-29 and glide on 07-30
      # went onto the floor with a 404 where their face should be, and their first
      # letter carried it as a broken image. Nobody should have to remember this.
      #
      # Before the render, so a face drawn here is copied into the build like any
      # other static file, and the deploy below serves it in this same run.
      - name: Any faces to render?
        id: faces
        run: python3 tools/missing_faces.py >> "$GITHUB_OUTPUT"
      # continue-on-error, both of them, on purpose: drawing a face involves an
      # npm registry and a browser, and neither belongs on the critical path of
      # publishing the record. If this breaks, the deploy below still goes out,
      # the build warns, and the production check goes red about the one missing
      # face — which is exactly the behaviour before this step existed. The build
      # check made that choice already; a fix for a missing picture must not be
      # able to stop the floor.
      - name: Draw them
        if: steps.faces.outputs.ids != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          IDS: ${{ steps.faces.outputs.ids }}
        run: |
          # Annotate on the way out: continue-on-error means a failure here shows
          # as a green step, and the run would otherwise say nothing about why a
          # trader is still faceless except in the production check that follows.
          npm install --no-fund --no-audit --silent puppeteer-core \
            || { echo "::warning::no faces drawn ($IDS): puppeteer-core would not install"; exit 1; }
          chrome="$(command -v google-chrome || command -v chromium-browser)" \
            || { echo "::warning::no faces drawn ($IDS): no Chrome on this runner"; exit 1; }
          CHROME="$chrome" node tools/gen-avatars.mjs --missing \
            || { echo "::warning::no faces drawn ($IDS): the generator failed"; exit 1; }
      # Commit them so this happens once per trader rather than once per deploy,
      # and so the PNG a letter links to is in the record like everything else.
      # Best effort: the engine pushes arena.json up to 38 times a day and can win
      # the race. Losing it costs nothing — the deploy below still serves the face
      # from this checkout, and the next publish retries the commit.
      - name: Keep them
        if: steps.faces.outputs.ids != ''
        continue-on-error: true
        run: |
          git config user.name arena-bot
          git config user.email arena-bot@users.noreply.github.com
          git add web/static/avatars
          git commit -qm "avatars: faces for ${{ steps.faces.outputs.ids }}" || exit 0
          git pull -q --rebase --autostash \
            || { echo "::warning::faces rendered but not committed (rebase failed)"; exit 0; }
          git push -q \
            || echo "::warning::faces rendered but not committed (push lost the race)"
      - name: Render
        run: python3 render.py
      # Between render and deploy, because the record is the least predictable
      # input this build has: nineteen traders' prose, baked into HTML, deployed
      # up to 38 times a day. A `</script>` in a journal line once took the whole
      # floor down. A bad bake now fails here instead of reaching the floor.
      - name: Check the build
        run: python3 tools/check_build.py
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: open-outcry
          channelId: live
      # And ask the live site whether it is really serving. Not a gate — the
      # deploy has happened — but the only thing that would tell anyone it went
      # out broken.
      - name: Check production
        run: python3 tools/check_prod.py
