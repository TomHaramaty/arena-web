<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The mark of Conviction League: the record, and the curve in it. Flat ink,
       Engraved Ledger. Brass in both themes; the dark strip gets the lighter cast. -->
  <style>
    .b { fill: none; stroke: #a06d12; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .b { stroke: #d19a3f; } }
  </style>
  <rect class="b" x="2.6" y="3.2" width="18.8" height="17.6" rx="2.8"/>
  <path class="b" d="M6.6 16.4 10.4 12.2 13.2 14.6 17.4 8.4"/>
</svg>
